<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">The languages of omics and their translation layer</title>
  <desc id="desc">Genomics, transcriptomics, proteomics, and other omics feed representations into an alignment and translation layer that supports downstream prediction and design.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#081d2b"/>
      <stop offset="1" stop-color="#123a4d"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" x2="1">
      <stop offset="0" stop-color="#21c7a8"/>
      <stop offset="1" stop-color="#6ed0ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#9bdff3"/>
    </marker>
  </defs>
  <rect width="1400" height="620" rx="28" fill="url(#bg)"/>
  <text x="70" y="78" font-family="Inter,Segoe UI,sans-serif" font-size="42" font-weight="700" fill="#fff">The languages of omics</text>
  <text x="70" y="116" font-family="Inter,Segoe UI,sans-serif" font-size="20" fill="#b9d9e6">Different data structures; one emerging translation problem</text>

  <g filter="url(#shadow)" font-family="Inter,Segoe UI,sans-serif">
    <rect x="70" y="170" width="270" height="130" rx="24" fill="#155a72" stroke="#6ed0ff" stroke-width="2"/>
    <text x="95" y="210" font-size="25" font-weight="700" fill="#fff">GENOMICS</text>
    <text x="95" y="244" font-size="18" fill="#d8f4ff">ordered sequence</text>
    <text x="95" y="274" font-size="18" fill="#8bd8f4">A · C · G · T + context</text>

    <rect x="70" y="330" width="270" height="130" rx="24" fill="#196a63" stroke="#6ee6c7" stroke-width="2"/>
    <text x="95" y="370" font-size="25" font-weight="700" fill="#fff">TRANSCRIPTOMICS</text>
    <text x="95" y="404" font-size="18" fill="#dcfff5">sparse weighted vocabulary</text>
    <text x="95" y="434" font-size="18" fill="#89ead0">gene × abundance × state</text>

    <rect x="1060" y="170" width="270" height="130" rx="24" fill="#5d416f" stroke="#d5a8ef" stroke-width="2"/>
    <text x="1085" y="210" font-size="25" font-weight="700" fill="#fff">PROTEOMICS</text>
    <text x="1085" y="244" font-size="18" fill="#f8eaff">sequence + structure</text>
    <text x="1085" y="274" font-size="18" fill="#dcb6ef">abundance · PTMs · spectra</text>

    <rect x="1060" y="330" width="270" height="130" rx="24" fill="#72522d" stroke="#f5c66f" stroke-width="2"/>
    <text x="1085" y="370" font-size="25" font-weight="700" fill="#fff">OTHER OMICS</text>
    <text x="1085" y="404" font-size="18" fill="#fff4dc">regulation + chemistry</text>
    <text x="1085" y="434" font-size="18" fill="#f2cc84">space · marks · metabolites</text>

    <rect x="470" y="190" width="460" height="250" rx="42" fill="#0c2a37" stroke="url(#bridge)" stroke-width="5"/>
    <text x="700" y="250" text-anchor="middle" font-size="22" font-weight="600" fill="#9be9da">ALIGN · TRANSLATE · GENERATE</text>
    <text x="700" y="310" text-anchor="middle" font-size="36" font-weight="750" fill="#fff">Cross-omics</text>
    <text x="700" y="352" text-anchor="middle" font-size="36" font-weight="750" fill="#fff">foundation models</text>
    <text x="700" y="397" text-anchor="middle" font-size="18" fill="#b9d9e6">shared spaces or conditional mappings</text>
  </g>

  <g stroke="#9bdff3" stroke-width="4" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)" opacity=".9">
    <path d="M350 235 C405 235, 420 250, 462 270"/>
    <path d="M350 395 C405 395, 420 380, 462 360"/>
    <path d="M938 270 C980 250, 995 235, 1050 235"/>
    <path d="M938 360 C980 380, 995 395, 1050 395"/>
  </g>

  <rect x="410" y="515" width="580" height="62" rx="31" fill="#f3fbfe"/>
  <text x="700" y="554" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="22" font-weight="650" fill="#123a4d">Downstream understanding · prediction · design</text>
  <path d="M700 450 L700 505" stroke="#9bdff3" stroke-width="4" marker-end="url(#arrow)"/>
</svg>
